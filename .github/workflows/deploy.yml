name: Deploy a GitHub Pages

# Publica la web en un solo archivo (npm run standalone) como index.html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Las etiquetas para compartir (index.html) apuntan a esta dirección y no a gobernatech.com (.env).
      - run: npm run standalone
        env:
          VITE_SITIO: https://goberna-lab.github.io/goberna-tech/
      - run: mkdir _site && cp goberna-tech.html _site/index.html && cp public/og-imagen.jpg public/apple-touch-icon.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
